<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1200" width="1760" height="1200"><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="62" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#111111" text-anchor="start" font-weight="bold">Vacuum plumbing</text><text x="40" y="106" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#444444" text-anchor="start" font-weight="normal">Pump → tank → two separate lines, one per cup chamber. Each line has its own valve, vent and pressure sensor.</text><g transform="translate(0,50)"><rect x="40" y="500" width="230" height="140" rx="16" fill="#e6e9ec" stroke="#37474f" stroke-width="4"/><text x="155.0" y="550.94" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#37474f" text-anchor="middle" font-weight="bold">Vacuum pump</text><text x="155.0" y="584.44" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">12 V DC</text><text x="155.0" y="612.5" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">speed by PWM</text><rect x="350" y="480" width="220" height="180" rx="16" fill="#e6e9ec" stroke="#37474f" stroke-width="4"/><text x="460.0" y="548.48" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#37474f" text-anchor="middle" font-weight="bold">Vacuum</text><text x="460.0" y="586.38" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="normal">tank</text><text x="460.0" y="618.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="normal">stores vacuum</text><path d="M270,570 L350,570" fill="none" stroke="#37474f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M460,480 L460,420" fill="none" stroke="#37474f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="460" cy="386" r="34" fill="#d4efea" stroke="#00796b" stroke-width="4"/><text x="460" y="398" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#00796b" text-anchor="middle" font-weight="bold">P</text><text x="412" y="382" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#00796b" text-anchor="end" font-weight="bold">Tank sensor</text><text x="412" y="410" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#444444" text-anchor="end" font-weight="normal">ADC ch 1</text><path d="M460,660 L460,720" fill="none" stroke="#37474f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="385" y="720" width="150" height="100" rx="16" fill="#eceff1" stroke="#455a64" stroke-width="4"/><text x="460.0" y="764.96" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#455a64" text-anchor="middle" font-weight="bold">SOL3</text><text x="460.0" y="800.1600000000001" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle" font-weight="normal">tank vent</text><path d="M460,820 L460,880" fill="none" stroke="#78909c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/><path d="M450.9,861.1 L460,880 L469.1,861.1 Z" fill="#78909c" stroke="#78909c" stroke-width="2"/><text x="460.0" y="919.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#546e7a" text-anchor="middle" font-weight="bold">to air</text><path d="M570,570 L630,570" fill="none" stroke="#37474f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M630,330 L630,800" fill="none" stroke="#37474f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M630,330 L1300,330" fill="none" stroke="#c96a00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><rect x="680" y="275" width="180" height="110" rx="16" fill="#ffffff" stroke="#c96a00" stroke-width="4"/><text x="770.0" y="324.34" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#c96a00" text-anchor="middle" font-weight="bold">SOL4</text><text x="770.0" y="362.23999999999995" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="normal">vacuum on</text><path d="M960,330 L960,260" fill="none" stroke="#c96a00" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="960" cy="226" r="34" fill="#d4efea" stroke="#00796b" stroke-width="4"/><text x="960" y="238" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#00796b" text-anchor="middle" font-weight="bold">P</text><text x="912" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#00796b" text-anchor="end" font-weight="bold">Clitoral sensor</text><text x="912" y="250" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#444444" text-anchor="end" font-weight="normal">ADC ch 2</text><path d="M1140,330 L1140,270" fill="none" stroke="#c96a00" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1065" y="170" width="150" height="100" rx="16" fill="#ffffff" stroke="#c96a00" stroke-width="4"/><text x="1140.0" y="214.96" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#c96a00" text-anchor="middle" font-weight="bold">SOL5</text><text x="1140.0" y="250.16000000000003" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle" font-weight="normal">vent</text><path d="M1140,170 L1140,110" fill="none" stroke="#78909c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/><path d="M1149.1,128.9 L1140,110 L1130.9,128.9 Z" fill="#78909c" stroke="#78909c" stroke-width="2"/><text x="1140.0" y="93.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#546e7a" text-anchor="middle" font-weight="bold">to air</text><path d="M630,800 L1300,800" fill="none" stroke="#1f5fbf" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><rect x="680" y="745" width="180" height="110" rx="16" fill="#ffffff" stroke="#1f5fbf" stroke-width="4"/><text x="770.0" y="794.34" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#1f5fbf" text-anchor="middle" font-weight="bold">SOL1</text><text x="770.0" y="832.24" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="normal">vacuum on</text><path d="M960,800 L960,870" fill="none" stroke="#1f5fbf" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="960" cy="904" r="34" fill="#d4efea" stroke="#00796b" stroke-width="4"/><text x="960" y="916" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#00796b" text-anchor="middle" font-weight="bold">P</text><text x="912" y="900" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#00796b" text-anchor="end" font-weight="bold">AVL sensor</text><text x="912" y="928" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#444444" text-anchor="end" font-weight="normal">ADC ch 0, anti-detach</text><path d="M1140,800 L1140,860" fill="none" stroke="#1f5fbf" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1065" y="860" width="150" height="100" rx="16" fill="#ffffff" stroke="#1f5fbf" stroke-width="4"/><text x="1140.0" y="904.96" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1f5fbf" text-anchor="middle" font-weight="bold">SOL2</text><text x="1140.0" y="940.1600000000001" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle" font-weight="normal">vent</text><path d="M1140,960 L1140,1020" fill="none" stroke="#78909c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/><path d="M1130.9,1001.1 L1140,1020 L1149.1,1001.1 Z" fill="#78909c" stroke="#78909c" stroke-width="2"/><text x="1140.0" y="1059.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#546e7a" text-anchor="middle" font-weight="bold">to air</text><rect x="1310" y="200" width="400" height="760" rx="30" fill="#f5f7fa" stroke="#37474f" stroke-width="4"/><text x="1510.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#111111" text-anchor="middle" font-weight="bold">A-Contour cup</text><rect x="1340" y="270" width="340" height="180" rx="16" fill="#ffd6a0" stroke="#c96a00" stroke-width="4"/><text x="1510.0" y="340.94" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c96a00" text-anchor="middle" font-weight="bold">Clitoral chamber</text><text x="1510.0" y="374.44" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">steady (engorge) or</text><text x="1510.0" y="402.5" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">5–13 Hz air pulses</text><rect x="1340" y="690" width="340" height="220" rx="16" fill="#cfe0fb" stroke="#1f5fbf" stroke-width="4"/><text x="1510.0" y="766.91" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1f5fbf" text-anchor="middle" font-weight="bold">Leg chamber</text><text x="1510.0" y="800.41" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">steady 30–50 mmHg</text><text x="1510.0" y="828.4699999999999" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">engorge + hold on</text><text x="1510.0" y="856.5299999999999" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#111111" text-anchor="middle" font-weight="normal">(both legs)</text><path d="M1300,330 L1340,330" fill="none" stroke="#c96a00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M1300,800 L1340,800" fill="none" stroke="#1f5fbf" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1340" cy="330" r="13" fill="#fff" stroke="#111111" stroke-width="5"/><circle cx="1340" cy="800" r="13" fill="#fff" stroke="#111111" stroke-width="5"/><rect x="1652" y="310" width="34" height="34" rx="7" fill="#f7b6d2" stroke="#c2185b" stroke-width="5"/><rect x="1652" y="750" width="34" height="34" rx="7" fill="#f7b6d2" stroke="#c2185b" stroke-width="5"/><rect x="1340" y="480" width="340" height="180" rx="16" fill="#d2f2dc" stroke="#1d7f43" stroke-width="4"/><text x="1510.0" y="552.78" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1d7f43" text-anchor="middle" font-weight="bold">Open channel</text><text x="1510.0" y="583.5799999999999" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="middle" font-weight="normal">no vacuum; fluids</text><text x="1510.0" y="609.1999999999999" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="middle" font-weight="normal">drain out</text><text x="1510.0" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c2185b" text-anchor="middle" font-weight="bold">Pink squares = manual vent flaps</text><text x="1510.0" y="1032" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#444444" text-anchor="middle" font-weight="normal">lift to release, no power needed</text><rect x="690" y="470" width="560" height="200" rx="16" fill="#fffafa" stroke="#b71c1c" stroke-width="4" stroke-dasharray="14 9"/><text x="712" y="539.97" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#b71c1c" text-anchor="start" font-weight="bold">Safety parts still to add</text><text x="712" y="570.77" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="start" font-weight="normal">• relief valve on each line, opens 85–100 mmHg</text><text x="712" y="596.39" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="start" font-weight="normal">• fluid filter at each cup port</text><text x="712" y="622.01" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="start" font-weight="normal">• vent valves open when power is lost</text><text x="40" y="1120" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111" text-anchor="start" font-weight="bold">Controller limits: 30–50 mmHg normal · 75 mmHg cap · 80 mmHg emergency stop · 100 mmHg never.</text></g></svg>