<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" font-family="DejaVu Sans,Arial" stroke="none" fill="none" stroke-width="1">
  <defs>
    <!-- Glass-like gradient for left A-leg -->
    <linearGradient id="glass-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="40%" style="stop-color:#c5d5e8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#f0f5fa;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Glass-like gradient for right A-leg -->
    <linearGradient id="glass-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="40%" style="stop-color:#c5d5e8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#f0f5fa;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Funnel gradient (hydrophilic coating - blue tint) -->
    <linearGradient id="funnel-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#2c5a8f;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#1a3d5c;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Collar gradient (silicone ring) -->
    <linearGradient id="collar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6b4a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6b4a2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a3520;stop-opacity:1"/>
    </linearGradient>
    <!-- Splash guard gradient -->
    <linearGradient id="splash-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ab8d9;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#4a8ab0;stop-opacity:0.8"/>
    </linearGradient>
    <!-- Beaker gradient -->
    <linearGradient id="beaker-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f4fc;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#c5dce8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e8f4fc;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Fluid gradient -->
    <linearGradient id="fluid-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b8c0"/>
      <stop offset="100%" style="stop-color:#e8ebee"/>
    </linearGradient>
    <!-- Rim gradient -->
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a9fb5"/>
      <stop offset="50%" style="stop-color:#5a7085"/>
      <stop offset="100%" style="stop-color:#8a9fb5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="1400" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="450" y="40" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="middle">INTEGRATED FLUID COLLECTION SYSTEM</text>
  <text x="450" y="65" font-size="14" fill="#5a6c7d" text-anchor="middle">V-Contour Cup + Zone 1 Funnel Integration</text>

  <!-- ============================================== -->
  <!-- V-CONTOUR A-SHAPE CUP (scaled smaller) -->
  <!-- ============================================== -->
  <g id="a-contour-cup" transform="translate(450, 200)">
    <!-- Left leg -->
    <path d="M 0 0 C -15 0, -60 30, -90 80 C -130 160, -160 240, -160 300 C -160 370, -130 420, -90 450 C -50 480, -25 460, -15 400 L -10 280 C -8 180, -5 80, 0 20 Z"
          fill="url(#glass-left)" stroke="url(#rim-gradient)" stroke-width="2"/>
    <!-- Right leg -->
    <path d="M 0 0 C 15 0, 60 30, 90 80 C 130 160, 160 240, 160 300 C 160 370, 130 420, 90 450 C 50 480, 25 460, 15 400 L 10 280 C 8 180, 5 80, 0 20 Z"
          fill="url(#glass-right)" stroke="url(#rim-gradient)" stroke-width="2"/>
    <!-- Center apex -->
    <ellipse cx="0" cy="15" rx="18" ry="22" fill="url(#glass-left)" stroke="none"/>
    
    <!-- Open Channel indicator -->
    <rect x="-15" y="420" width="30" height="35" fill="#a0b8c8" opacity="0.6" stroke="#5a7085" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="440" font-size="8" fill="#3a4a5a" text-anchor="middle">OPEN</text>
    <text x="0" y="450" font-size="8" fill="#3a4a5a" text-anchor="middle">CHANNEL</text>
    
    <!-- Labels for vacuum zones -->
    <text x="-100" y="280" font-size="9" fill="#2c3e50" text-anchor="middle">LEFT</text>
    <text x="-100" y="292" font-size="9" fill="#2c3e50" text-anchor="middle">A-LEG</text>
    <text x="-100" y="306" font-size="7" fill="#5a6c7d" text-anchor="middle">(Vacuum)</text>
    
    <text x="100" y="280" font-size="9" fill="#2c3e50" text-anchor="middle">RIGHT</text>
    <text x="100" y="292" font-size="9" fill="#2c3e50" text-anchor="middle">A-LEG</text>
    <text x="100" y="306" font-size="7" fill="#5a6c7d" text-anchor="middle">(Vacuum)</text>
  </g>

  <!-- Fluid flow arrows from open channel -->
  <g id="fluid-flow-arrows">
    <path d="M 450 660 L 450 700" stroke="#4a90d9" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#4a90d9"/>
      </marker>
    </defs>
  </g>

  <!-- ============================================== -->
  <!-- FUNNEL COLLAR (Snap-fit interface) -->
  <!-- ============================================== -->
  <g id="funnel-collar" transform="translate(450, 670)">
    <!-- Collar ring -->
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="url(#collar-gradient)" stroke="#3a2510" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="30" ry="9" fill="#a0b8c8" stroke="#5a7085" stroke-width="1"/>
    
    <!-- Snap-fit detents (4 points) -->
    <circle cx="-45" cy="0" r="5" fill="#8b6b4a" stroke="#4a3520" stroke-width="1"/>
    <circle cx="45" cy="0" r="5" fill="#8b6b4a" stroke="#4a3520" stroke-width="1"/>
    <circle cx="0" cy="-12" r="5" fill="#8b6b4a" stroke="#4a3520" stroke-width="1"/>
    <circle cx="0" cy="12" r="5" fill="#8b6b4a" stroke="#4a3520" stroke-width="1"/>
    
    <!-- Label -->
    <text x="85" y="5" font-size="10" fill="#4a3520" font-weight="bold">FUNNEL COLLAR</text>
    <text x="85" y="18" font-size="8" fill="#6b4a2a">(Snap-fit, 4 detents)</text>
  </g>

  <!-- ============================================== -->
  <!-- ZONE 1: CLOSE-RANGE FUNNEL -->
  <!-- ============================================== -->
  <g id="zone1-funnel" transform="translate(450, 750)">
    <!-- Funnel shape (hydrophilic coated) -->
    <path d="M -80 0 C -80 20, -60 60, -40 100 L -15 180 L 15 180 L 40 100 C 60 60, 80 20, 80 0 Z"
          fill="url(#funnel-gradient)" stroke="#1a3d5c" stroke-width="2"/>
    <!-- Ribbed surface lines (capillary action) -->
    <path d="M -60 30 C -50 60, -35 110, -25 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M -40 30 C -35 60, -25 110, -18 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M -20 30 C -18 60, -15 110, -12 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M 0 30 C 0 60, 0 110, 0 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M 20 30 C 18 60, 15 110, 12 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M 40 30 C 35 60, 25 110, 18 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    <path d="M 60 30 C 50 60, 35 110, 25 150" stroke="#2c5a8f" stroke-width="1" opacity="0.6"/>
    
    <!-- Hydrophilic coating label -->
    <text x="-120" y="60" font-size="9" fill="#1a3d5c">Hydrophilic</text>
    <text x="-120" y="72" font-size="9" fill="#1a3d5c">Coating</text>
    <line x1="-85" y1="66" x2="-75" y2="50" stroke="#1a3d5c" stroke-width="1"/>
    
    <!-- Ribbed surface label -->
    <text x="90" y="90" font-size="9" fill="#1a3d5c">Ribbed</text>
    <text x="90" y="102" font-size="9" fill="#1a3d5c">Surface</text>
    <line x1="85" y1="96" x2="65" y2="80" stroke="#1a3d5c" stroke-width="1"/>
    
    <!-- Zone 1 label box -->
    <rect x="-140" y="130" width="80" height="40" fill="#4a90d9" opacity="0.2" rx="5"/>
    <text x="-100" y="150" font-size="11" fill="#1a3d5c" font-weight="bold" text-anchor="middle">ZONE 1</text>
    <text x="-100" y="163" font-size="8" fill="#2c5a8f" text-anchor="middle">Close-Range Funnel</text>
  </g>

  <!-- ============================================== -->
  <!-- DRAINAGE TUBE (6mm ID silicone) -->
  <!-- ============================================== -->
  <g id="drainage-tube">
    <rect x="442" y="930" width="16" height="60" fill="#a0c8d8" stroke="#5a8090" stroke-width="1" rx="3"/>
    <text x="480" y="955" font-size="8" fill="#5a8090">6mm ID</text>
    <text x="480" y="967" font-size="8" fill="#5a8090">Silicone Tube</text>
  </g>

  <!-- ============================================== -->
  <!-- CHECK VALVE (One-way) -->
  <!-- ============================================== -->
  <g id="check-valve" transform="translate(450, 1005)">
    <rect x="-20" y="-12" width="40" height="24" fill="#c0c8d0" stroke="#5a6070" stroke-width="2" rx="4"/>
    <polygon points="-8,0 8,-8 8,8" fill="#5a6070"/>
    <text x="35" y="5" font-size="10" fill="#4a5060" font-weight="bold">CHECK VALVE</text>
    <text x="35" y="17" font-size="8" fill="#6a7080">(One-way, prevents backflow)</text>
  </g>

  <!-- Tube from check valve to Zone 2 -->
  <g id="tube-to-zone2">
    <rect x="442" y="1017" width="16" height="40" fill="#a0c8d8" stroke="#5a8090" stroke-width="1" rx="3"/>
  </g>

  <!-- ============================================== -->
  <!-- ZONE 2: WIDE-RANGE SPLASH GUARD -->
  <!-- ============================================== -->
  <g id="zone2-splash-guard" transform="translate(450, 1100)">
    <!-- Parabolic splash guard -->
    <path d="M -125 0 Q -100 60 -40 80 L -15 85 L 15 85 L 40 80 Q 100 60 125 0 L 115 -10 Q 90 45 40 65 L 0 70 L -40 65 Q -90 45 -115 -10 Z"
          fill="url(#splash-gradient)" stroke="#3a6a8a" stroke-width="2"/>

    <!-- Ejaculation trajectory arrows -->
    <path d="M -60 -80 L -40 -20" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#red-arrow)"/>
    <path d="M 0 -90 L 0 -30" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#red-arrow)"/>
    <path d="M 60 -80 L 40 -20" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#red-arrow)"/>
    <defs>
      <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#e74c3c"/>
      </marker>
    </defs>
    <text x="85" y="-60" font-size="8" fill="#c0392b">Ejaculation</text>
    <text x="85" y="-48" font-size="8" fill="#c0392b">Jets (1-3 m/s)</text>

    <!-- Central drain -->
    <ellipse cx="0" cy="75" rx="18" ry="8" fill="#4a8ab0" stroke="#3a6a8a" stroke-width="1"/>
    <text x="30" y="78" font-size="8" fill="#3a6a8a">Central Drain</text>

    <!-- Zone 2 label -->
    <rect x="-140" y="30" width="80" height="40" fill="#7ab8d9" opacity="0.3" rx="5"/>
    <text x="-100" y="50" font-size="11" fill="#3a6a8a" font-weight="bold" text-anchor="middle">ZONE 2</text>
    <text x="-100" y="63" font-size="8" fill="#4a8ab0" text-anchor="middle">Splash Guard</text>
  </g>

  <!-- Tube from Zone 2 to reservoir -->
  <g id="tube-to-reservoir">
    <rect x="442" y="1185" width="16" height="30" fill="#a0c8d8" stroke="#5a8090" stroke-width="1" rx="3"/>
  </g>

  <!-- ============================================== -->
  <!-- COLLECTION RESERVOIR (Beaker on Load Cell) -->
  <!-- ============================================== -->
  <g id="collection-reservoir" transform="translate(450, 1270)">
    <!-- Beaker -->
    <path d="M -50 -40 L -45 50 Q -40 60 0 60 Q 40 60 45 50 L 50 -40 L 40 -45 L -40 -45 Z"
          fill="url(#beaker-gradient)" stroke="#5a8090" stroke-width="2"/>
    <!-- Fluid level -->
    <path d="M -43 20 L -40 50 Q -35 58 0 58 Q 35 58 40 50 L 43 20 Q 0 25 -43 20 Z"
          fill="url(#fluid-gradient)" stroke="none"/>
    <!-- Graduation marks -->
    <line x1="-48" y1="0" x2="-40" y2="0" stroke="#5a8090" stroke-width="1"/>
    <line x1="-48" y1="20" x2="-40" y2="20" stroke="#5a8090" stroke-width="1"/>
    <line x1="-48" y1="40" x2="-40" y2="40" stroke="#5a8090" stroke-width="1"/>
    <text x="-55" y="3" font-size="6" fill="#5a8090" text-anchor="end">100</text>
    <text x="-55" y="23" font-size="6" fill="#5a8090" text-anchor="end">150</text>
    <text x="-55" y="43" font-size="6" fill="#5a8090" text-anchor="end">200</text>

    <!-- Load cell platform -->
    <rect x="-60" y="65" width="120" height="12" fill="#4a5060" stroke="#3a4050" stroke-width="1" rx="2"/>
    <text x="0" y="74" font-size="7" fill="#c0c8d0" text-anchor="middle">TAL220 500g LOAD CELL</text>

    <!-- Reservoir label -->
    <text x="80" y="10" font-size="10" fill="#3a4a5a" font-weight="bold">COLLECTION</text>
    <text x="80" y="22" font-size="10" fill="#3a4a5a" font-weight="bold">RESERVOIR</text>
    <text x="80" y="35" font-size="8" fill="#5a6a7a">200mL Borosilicate</text>
  </g>

  <!-- ============================================== -->
  <!-- SPECIFICATIONS BOX -->
  <!-- ============================================== -->
  <g id="specs-box" transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="180" fill="#ffffff" opacity="0.9" stroke="#5a7085" stroke-width="1" rx="5"/>
    <text x="90" y="20" font-size="11" fill="#2c3e50" font-weight="bold" text-anchor="middle">SPECIFICATIONS</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#5a7085" stroke-width="1"/>

    <text x="10" y="45" font-size="9" fill="#2c3e50" font-weight="bold">Funnel Collar:</text>
    <text x="15" y="58" font-size="8" fill="#5a6c7d">• Inlet: 35×50mm rect</text>
    <text x="15" y="70" font-size="8" fill="#5a6c7d">• Outlet: 80mm circular</text>
    <text x="15" y="82" font-size="8" fill="#5a6c7d">• 4× snap-fit detents</text>

    <text x="10" y="98" font-size="9" fill="#2c3e50" font-weight="bold">Zone 1 Funnel:</text>
    <text x="15" y="111" font-size="8" fill="#5a6c7d">• Diameter: 80mm</text>
    <text x="15" y="123" font-size="8" fill="#5a6c7d">• Hydrophilic coating</text>
    <text x="15" y="135" font-size="8" fill="#5a6c7d">• Ribbed internal surface</text>

    <text x="10" y="151" font-size="9" fill="#2c3e50" font-weight="bold">Zone 2 Guard:</text>
    <text x="15" y="164" font-size="8" fill="#5a6c7d">• Diameter: 250mm</text>
    <text x="15" y="176" font-size="8" fill="#5a6c7d">• Parabolic surface</text>
  </g>

  <!-- ============================================== -->
  <!-- CAPTURE RATES BOX -->
  <!-- ============================================== -->
  <g id="capture-box" transform="translate(670, 100)">
    <rect x="0" y="0" width="180" height="120" fill="#e8f8e8" opacity="0.9" stroke="#4a8a4a" stroke-width="1" rx="5"/>
    <text x="90" y="20" font-size="11" fill="#2a6a2a" font-weight="bold" text-anchor="middle">CAPTURE RATES</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#4a8a4a" stroke-width="1"/>

    <text x="15" y="48" font-size="9" fill="#2a6a2a">Lubrication:</text>
    <text x="120" y="48" font-size="9" fill="#2a6a2a" font-weight="bold">95%+</text>

    <text x="15" y="65" font-size="9" fill="#2a6a2a">Pre-orgasmic:</text>
    <text x="120" y="65" font-size="9" fill="#2a6a2a" font-weight="bold">98%+</text>

    <text x="15" y="82" font-size="9" fill="#2a6a2a">Ejaculation:</text>
    <text x="120" y="82" font-size="9" fill="#2a6a2a" font-weight="bold">95%+</text>

    <line x1="10" y1="92" x2="170" y2="92" stroke="#4a8a4a" stroke-width="1"/>
    <text x="15" y="110" font-size="10" fill="#1a5a1a" font-weight="bold">Total Average: ~95%</text>
  </g>

  <!-- Drawing info block -->
  <rect x="620" y="1340" width="260" height="50" stroke="#5a7085" stroke-width="1" fill="#fff"/>
  <text x="630" y="1358" font-size="9" font-weight="bold" fill="#2c3e50">INTEGRATED FLUID COLLECTION SYSTEM</text>
  <text x="630" y="1372" font-size="8" fill="#5a6c7d">V-Contour + Zone 1/2 Catchment</text>
  <text x="780" y="1358" font-size="8" fill="#5a6c7d">Drawing: FCS-001</text>
  <text x="780" y="1372" font-size="8" fill="#5a6c7d">Rev: A</text>
  <text x="780" y="1386" font-size="8" fill="#5a6c7d">Date: 2026-01-12</text>
</svg>

