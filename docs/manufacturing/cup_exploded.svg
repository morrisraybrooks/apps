<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="DejaVu Sans,Arial" stroke="none" fill="none" stroke-width="1">
  <defs>
    <!-- Glass-like gradient for left A-leg -->
    <linearGradient id="glass-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="15%" style="stop-color:#e8eef5;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#c5d5e8;stop-opacity:0.85"/>
      <stop offset="60%" style="stop-color:#a8c0d8;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#d0dce8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#f0f5fa;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Glass-like gradient for right A-leg -->
    <linearGradient id="glass-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="15%" style="stop-color:#e8eef5;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#c5d5e8;stop-opacity:0.85"/>
      <stop offset="60%" style="stop-color:#a8c0d8;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#d0dce8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#f0f5fa;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Highlight gradient for glass reflection -->
    <linearGradient id="glass-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <!-- Red/burgundy gradient for clitoral cylinder (teardrop) -->
    <radialGradient id="clitoral-gradient" cx="40%" cy="30%" r="70%" fx="30%" fy="20%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#c0392b;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#8b1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a1010;stop-opacity:1"/>
    </radialGradient>
    <!-- Highlight for clitoral cylinder -->
    <radialGradient id="clitoral-highlight" cx="30%" cy="25%" r="40%" fx="25%" fy="20%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <!-- Edge/rim gradient -->
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a9fb5"/>
      <stop offset="50%" style="stop-color:#5a7085"/>
      <stop offset="100%" style="stop-color:#8a9fb5"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b8c0"/>
      <stop offset="50%" style="stop-color:#d0d5da"/>
      <stop offset="100%" style="stop-color:#e8ebee"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    <!-- Inner channel gradient -->
    <linearGradient id="channel-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0b0c0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c0ccd8;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#bg-gradient)"/>

  <!-- Subtle ground shadow -->
  <ellipse cx="400" cy="920" rx="220" ry="35" fill="url(#shadow-gradient)"/>

  <!-- ============================================== -->
  <!-- UNIFIED A-CONTOUR (Seamless single piece) -->
  <!-- ============================================== -->
  <g id="a-contour-unified">
    <!-- Left leg with seamless top connection -->
    <path d="M 400 120
             C 380 120, 320 160, 280 240
             C 200 380, 140 500, 140 600
             C 140 720, 180 830, 240 880
             C 300 930, 340 910, 360 830
             L 370 650
             C 375 500, 385 300, 400 180 Z"
          fill="url(#glass-left)" stroke="url(#rim-gradient)" stroke-width="3"/>
    <!-- Left glass highlight -->
    <path d="M 340 220
             C 280 300, 200 420, 190 540
             C 185 620, 200 720, 240 790
             C 220 660, 250 440, 320 280 Z"
          fill="url(#glass-highlight)" opacity="0.6"/>

    <!-- Right leg with seamless top connection -->
    <path d="M 400 120
             C 420 120, 480 160, 520 240
             C 600 380, 660 500, 660 600
             C 660 720, 620 830, 560 880
             C 500 930, 460 910, 440 830
             L 430 650
             C 425 500, 415 300, 400 180 Z"
          fill="url(#glass-right)" stroke="url(#rim-gradient)" stroke-width="3"/>
    <!-- Right glass highlight -->
    <path d="M 460 220
             C 520 300, 600 420, 610 540
             C 615 620, 600 720, 560 790
             C 580 660, 550 440, 480 280 Z"
          fill="url(#glass-highlight)" opacity="0.6"/>

    <!-- Seamless top fill to cover any line at apex -->
    <ellipse cx="400" cy="140" rx="25" ry="30" fill="url(#glass-left)" stroke="none"/>
  </g>





  <!-- ============================================== -->
  <!-- ADDITIONAL GLASS HIGHLIGHTS -->
  <!-- ============================================== -->
  <g id="extra-highlights" opacity="0.4">
    <!-- Left leg bottom highlight -->
    <ellipse cx="240" cy="850" rx="60" ry="25" fill="#ffffff" opacity="0.3"/>
    <!-- Right leg bottom highlight -->
    <ellipse cx="560" cy="850" rx="60" ry="25" fill="#ffffff" opacity="0.3"/>
  </g>


  <!-- Small decorative sparkle in corner (like the reference image) -->
  <g id="sparkle" transform="translate(750, 950)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z"
          fill="#c0ccd8" opacity="0.6"/>
  </g>

</svg>